name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare project
        run: |
          mkdir -p app/src/main/java/com/nmt/navchannia app/src/main/assets
          cp MainActivity.kt app/src/main/java/com/nmt/navchannia/
          cp data.json app/src/main/assets/
          cp AndroidManifest.xml app/src/main/
          cp app-build.gradle.kts app/build.gradle.kts
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/NMT.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Остання версія
          files: out/NMT.apk
          make_latest: true
